  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Maidenhead — Riverside Town on the Thames</title>
    <meta name="description" content="Discover Maidenhead — a fast-growing riverside town with excellent Elizabeth Line links, vibrant regeneration, and scenic waterfront charm." />
    <meta property="og:image" content="/og-image.jpg" />
    <!-- Editorial font pairing, modelled on the reference system:
         · Fraunces (Google) — high-contrast display serif for hero titles and
           major editorial headings, closest free equivalent to Reckless Neue.
           Light 300 + Regular 400 only, matching the reference's restraint.
         · Switzer (Fontshare) — grotesque sans for nav, body, cards and all UI,
           closest free equivalent to Suisse Int'l. Weights 300–600. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://api.fontshare.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..400&family=Playfair+Display:wght@400;500;600&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://api.fontshare.com/v2/css?f[]=switzer@300,400,500,600&display=swap"
    />
    <!-- Mobile PWA demo (scope: /mobile/) — does not affect the main desktop site -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1C2E38" />
    <link rel="apple-touch-icon" href="/mobile-icons/apple-touch-icon.png" />
  </head>
